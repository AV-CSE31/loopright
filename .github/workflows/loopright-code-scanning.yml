name: LoopRight Code Scanning

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  loopright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dogfoods the published composite action. External repositories use:
      #   - uses: AV-CSE31/loopright@main
      - name: Generate LoopRight SARIF
        uses: ./
        with:
          path: skills/loopright/scripts
          format: sarif
          output: loopright.sarif

      - name: Upload LoopRight SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: loopright.sarif
