name: LoopRight Code Scanning

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  loopright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate LoopRight SARIF
        run: |
          python skills/loopright/scripts/loopright.py scan skills/loopright/scripts --format sarif --output loopright.sarif
      - name: Upload LoopRight SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: loopright.sarif
