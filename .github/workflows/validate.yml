name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate example contracts
        run: |
          python skills/loopright/scripts/loopright.py validate-contracts \
            examples/retry-loop \
            examples/async-processing \
            examples/ml-tuning \
            examples/agent-loop \
            examples/tasks \
            examples/field-guide
      - name: Validate pattern catalog
        run: |
          python skills/loopright/scripts/loopright.py validate-catalog catalog/loopright-patterns.json
          python skills/loopright/scripts/generate-pattern-docs.py catalog/loopright-patterns.json catalog
          git diff --exit-code -- catalog/catalog.md catalog/llms.txt skills/loopright/references/pattern-catalog.md skills/loopright/references/pattern-catalog.json skills/loopright/references/llms.txt
      - name: Validate loop evidence bundles
        run: |
          for bundle in examples/evidence-bundles/*.json; do
            python skills/loopright/scripts/loopright.py validate-run "$bundle" --fail-on-warning
          done
      - name: Run runnable examples
        run: |
          python -m unittest discover -s examples/runnable/python -p "test_*.py"
      - name: Run scanner benchmark
        run: |
          python benchmarks/run_loopright_benchmark.py
      - name: Discover loop risks
        run: |
          python skills/loopright/scripts/loopright.py scan skills/loopright/scripts --format sarif --output loopright.sarif
          python skills/loopright/scripts/loopright.py scan skills/loopright/scripts --fail-on-risk
