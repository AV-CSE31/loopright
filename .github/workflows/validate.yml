name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate example contracts
        run: |
          python skills/loopright/scripts/validate-all-contracts.py \
            examples/retry-loop \
            examples/async-processing \
            examples/ml-tuning \
            examples/agent-loop \
            examples/tasks
