name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate example contracts
        run: |
          python skills/loopright/scripts/validate-all-contracts.py \
            examples/retry-loop \
            examples/async-processing \
            examples/ml-tuning \
            examples/agent-loop \
            examples/tasks
      - name: Validate pattern catalog
        run: |
          python skills/loopright/scripts/validate-pattern-catalog.py catalog/loopright-patterns.json
          python skills/loopright/scripts/generate-pattern-docs.py catalog/loopright-patterns.json catalog
          git diff --exit-code -- catalog/catalog.md catalog/llms.txt skills/loopright/references/pattern-catalog.md skills/loopright/references/pattern-catalog.json
      - name: Discover loop risks
        run: |
          python skills/loopright/scripts/discover-loop-risks.py skills/loopright/scripts --fail-on-risk
